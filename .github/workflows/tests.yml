name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            fastapi \
            uvicorn \
            pyjwt \
            passlib \
            python-multipart \
            requests \
            httpx \
            psutil \
            netaddr \
            netifaces \
            pydantic \
            pytest \
            pytest-asyncio \
            anyio

      - name: Run unit tests
        run: python -m pytest test/ -v

  # The stack omr-admin is deployed on: Debian 13's own Python packages,
  # not the latest PyPI releases the job above installs.
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install the Debian packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-fastapi python3-uvicorn \
            python3-jwt python3-requests python3-netaddr python3-netifaces python3-psutil \
            python3-pydantic python3-multipart python3-httpx python3-pytest

      - name: Run unit tests
        run: python3 -m pytest test/ -q
