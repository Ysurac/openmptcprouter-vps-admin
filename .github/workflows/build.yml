name: Build

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper python3 python3-distutils-extra dh-python

    - name: Build Debian package
      run: dpkg-buildpackage -b -us -uc

    - name: Move deb packages
      run: mkdir packages && mv ../*.deb packages/
      
    - uses: actions/upload-artifact@v4
      with:
        name: Debian packages
        path: packages
    - name: Deploy - Create directory
      uses: ysurac/ssh-action@5a841de87115730aff750ac127773e3b2b3f56dd # master
      with:
        command: |
          mkdir -p deploy/debian
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt
    - name: Deploy - Upload via rsync
      uses: ysurac/action-rsync@1032c2593f9067e6ce901a1d77c6342dc50bcd24 # master
      env:
        ARGS: -av
        TARGET: deploy/package
        SOURCE: ./packages/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}